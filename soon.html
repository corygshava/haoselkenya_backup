<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>We'll Be Back Soon</title>
	<style>
		:root {
			--bg-color: #00020d;
			--text-color: #ffffff;
			--accent-color: #054ff6;
			--altdark: #1e1a1a;
		}

		* {
			box-sizing: border-box;
			transition: 0.3s ease-out;
		}

		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background-image: linear-gradient(100deg,var(--altdark),var(--bg-color));
			color: var(--text-color);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			padding: 2rem;
			text-align: center;
		}

		h1 {
			font-size: 2.5rem;
			margin-bottom: 1rem;
			padding: 24px;
			border-bottom: 2px solid var(--accent-color);
		}

		p {
			/*font-size: 1.2rem;*/
			margin-bottom: 2rem;
		}

		form {
			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: center;
			gap: 20px;
			max-width: 600px;
			width: 100%;
		}

		input[type="email"] {
			display: inline-block;
			padding: 12px 16px;
			width: 100%;
			max-width: 300px;
			border: none;
			border-radius: 5px;
			font-size: 1rem;
		}
		input[type="email"]:focus {
			outline: none;
			box-shadow: 0 0 12px var(--accent-color);
		}

		button {
			background-color: var(--accent-color);
			color: #fff;
			border: none;
			padding: 12px 16px;
			font-size: 1rem;
			border-radius: 5px;
			cursor: pointer;
		}

		button:hover {
			opacity: 0.8;
		}

		.footer {
			margin-top: 2rem;
			font-size: 0.9rem;
			opacity: 0.6;
			position: fixed;
			bottom: 0;
			width: 100%;
			padding: 32px;
		}
	</style>
</head>
<body>
	<h1>Site Under Maintenance</h1>
	<p>We're doing some updates. The site will be back soon. Stay in the loop:</p>

	<form action="subscribe.php" method="POST" style="display: none;">
		<input type="email" name="email" placeholder="Enter your email" required>
		<button type="submit">Join Watchlist</button>
	</form>

	<div class="footer">Thanks for your patience.</div>
</body>
</html>
